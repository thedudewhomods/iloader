name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iloader
        uses: actions/checkout@v4
        with:
          path: iloader

      - name: Checkout easy (rusbmux)
        uses: actions/checkout@v4
        with:
          repository: thedudewhomods/easy
          path: easy

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and targets
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Setup Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Link rusbmux and build APK
        working-directory: iloader
        run: |
          grep -q 'rusbmux' src-tauri/Cargo.toml || sed -i '/\[dependencies\]/a rusbmux = { path = "../../easy", default-features = false, features = ["nusb"] }' src-tauri/Cargo.toml
          bun install
          bunx tauri android init
          bunx tauri android build --debug --target aarch64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iloader-debug-apk
          path: iloader/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
